# The one hand-kept table behind the mod's map-marker icons.
#
# tools/generate_icons.py turns it into the five MapMarkerIconDataBlock assets
# and the C# legacy mapping. Icon order is the order in the marker dialog, and
# the addresses ascend in that order because each loader sorts its blocks by
# address. An address is an icon's identity in every saved marker: never change
# one once it has shipped.
#
# A variant's `type` is a MapMarkers+ PlusMarkerType name; its large sprite is
# markers_<type>. `small` names the minimap slice; without it the minimap uses
# the large sprite. A variant with `vanilla` points at a vanilla block and hides
# that variant from the dialog, converting it to the vanilla target; indices never
# shift, hiding included.

[vanilla]
Cross = "adbecb0c-1236-bf84-d9ea-0516e188e2d0"
Dot = "f9203606-618b-6384-7a99-a790e5c6de35"
Flag = "3005a608-1b77-8604-8abe-d189ae05a0d8"
Home = "64007694-5b2f-5474-b8ad-9f972e822421"
