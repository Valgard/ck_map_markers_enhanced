# The one hand-kept table behind the mod's map-marker icons.
#
# tools/generate_icons.py turns it into the MapMarkerIconDataBlock assets and
# the C# tables in IconTable.g.cs. An address is an icon's identity in every
# saved marker: never change one once it has shipped, and never reuse one.
#
# [[icon]] lists the blocks the mod ships, in dialog order; their addresses
# ascend in that order because each loader sorts its blocks by address. A
# variant's `name` is its identity in this table; its sprite in both sheets is
# the Pixaki layer of the same name with a space before every inner capital or
# digit, or `layer` where the two differ by more than that. Variant order is
# the layer order of the icon's `Large` group in sources/mme_markers.pixaki.
#
# [[retired]] lists the 1.x blocks, gone from the game but still stored in
# saved markers: each variant's `type` (a MapMarkers+ PlusMarkerType) in 1.x
# index order, the only record of which stored index meant which motif. Each
# goes to its `vanilla` target if it has one, else to the [[icon]] variant of
# the same name.

